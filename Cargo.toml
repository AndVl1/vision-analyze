[package]
name = "vision-analyze"
version = "0.1.1"
edition = "2021"
description = "CLI for visual screenshot analysis via llama.cpp — local vision LLM fallback for UI automation"
license = "MIT"
repository = "https://github.com/AndVl1/vision-analyze"
homepage = "https://github.com/AndVl1/vision-analyze"
readme = "README.md"
keywords = ["llama-cpp", "vision", "cli", "ui-testing", "screenshot"]
categories = ["command-line-utilities"]
rust-version = "1.75"

[[bin]]
name = "vision-analyze"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "signal", "fs", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
anyhow = "1"
arc-swap = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
directories = "6"
shellexpand = "3"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
