  key_decisions:
    - topic: daemon fork / detach
      decision: >
        Used std::process::Command (not tokio::process::Command) with
        pre_exec(setsid) so the child becomes a session leader before exec.
        Stdin/stdout/stderr set to Stdio::null(). The parent does NOT await the
        child — it polls the Unix socket for up to 5 s to confirm readiness.
      rationale: >
        tokio::process::Command does not expose pre_exec on stable Rust.
        std::process::Command::pre_exec is stable via std::os::unix::process::CommandExt.

    - topic: socket cleanup on shutdown
      decision: >
        cleanup() called in run() after the accept-loop exits (whether due to
        signal or Stop request). cleanup() is intentionally infallible —
        remove_file errors are logged at debug level and ignored so shutdown
        always completes cleanly even if files were already removed.
      rationale: >
        The daemon must not hang on shutdown due to cleanup errors.
        Files may already be absent if stop() was called concurrently.

    - topic: stale-socket detection
      decision: >
        maybe_remove_stale_socket() reads the PID file and does kill(pid, 0)
        before removing the socket. Returns Err if the process is alive.
      rationale: >
        Prevents two daemons binding to the same socket path, which would cause
        the second one to silently take over connections.

    - topic: warm fallback to cold
      decision: >
        In inference(), if the warm daemon responds with SocketResponse::Error,
        the CLI falls through to the cold path transparently. Any other
        unexpected response also falls through.
      rationale: >
        Resilience — a transient daemon error should not hard-fail the user's
        inference call.

    - topic: broadcast channel for shutdown
      decision: >
        Uses tokio::sync::broadcast::Sender<()> to coordinate shutdown between
        the accept-loop and per-connection handlers. A Stop request from any
        client triggers the broadcast.
      rationale: >
        Simple and avoids a Mutex<bool>. Capacity of 1 is sufficient because
        only one Stop is ever needed.

  todos: []

